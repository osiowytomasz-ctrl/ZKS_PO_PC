<title>Grafik ZKS PO</title>
<!-- Grafik do wglądu na telefonie (iPhone, Android) – dostęp na osobisty kod. Backend: GrafikKod.gs (grk_view). -->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #f4f4f4; color: #222; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  .hidden { display: none !important; }
  #login { max-width: 360px; margin: 0 auto; padding: 48px 20px; text-align: center; }
  #login img { width: 96px; height: 96px; }
  #login h1 { font-size: 22px; color: #BE1E2D; margin: 10px 0 4px; }
  #login p { font-size: 14px; color: #555; margin: 0 0 18px; }
  #code { width: 100%; font-size: 26px; letter-spacing: 6px; text-align: center; padding: 10px; border: 2px solid #BE1E2D; border-radius: 10px; }
  .btn { border: 1px solid #999; background: #fff; border-radius: 8px; padding: 6px 10px; font-size: 14px; color: #222; }
  .btn.red { background: #BE1E2D; border-color: #BE1E2D; color: #fff; font-weight: bold; }
  #go { width: 100%; margin-top: 12px; padding: 12px; font-size: 17px; }
  #err { color: #c00; font-size: 14px; min-height: 20px; margin-top: 10px; }
  #app { display: flex; flex-direction: column; height: 100%; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 6px 8px; padding-top: max(6px, env(safe-area-inset-top)); background: #fff; border-bottom: 2px solid #BE1E2D; }
  header img { width: 30px; height: 30px; }
  header .t { font-weight: bold; color: #BE1E2D; font-size: 16px; }
  header .who { font-size: 12px; color: #666; flex: 1; min-width: 80px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .row { display: flex; gap: 6px; width: 100%; align-items: center; }
  #q { flex: 1; min-width: 0; font-size: 15px; padding: 6px 8px; border: 1px solid #aaa; border-radius: 8px; }
  #range { font-size: 12px; color: #444; white-space: nowrap; }
  #wrap { flex: 1; overflow: auto; -webkit-overflow-scrolling: touch; padding-bottom: env(safe-area-inset-bottom); }
  table { border-collapse: separate; border-spacing: 0; font-size: 12px; }
  th, td { border-right: 1px solid #ccc; border-bottom: 1px solid #ccc; padding: 0 2px; height: 26px; text-align: center; white-space: nowrap; }
  thead th { position: sticky; top: 0; z-index: 2; background: #fff; font-weight: normal; font-size: 11px; line-height: 1.15; min-width: 40px; }
  thead th.today { outline: 2px solid #BE1E2D; outline-offset: -2px; font-weight: bold; }
  .nm { position: sticky; left: 0; z-index: 1; background: #fff; text-align: left; padding: 0 6px; max-width: 140px; overflow: hidden; text-overflow: ellipsis; }
  thead th.nm { z-index: 3; }
  .pl { color: #777; font-size: 10px; }
  tr.sep td { background: #e6e6e6; font-weight: bold; text-align: left; padding-left: 6px; }
  tr.sep td.nm { background: #e6e6e6; }
  tr.me td.nm { background: #fff3c4; font-weight: bold; }
  td.c { position: relative; min-width: 40px; }
  td.c.note::after { content: ""; position: absolute; top: 0; right: 0; border-top: 7px solid #ff9800; border-left: 7px solid transparent; }
  #msg { position: fixed; left: 12px; right: 12px; bottom: max(16px, env(safe-area-inset-bottom)); background: #333; color: #fff; padding: 10px 12px; border-radius: 10px; font-size: 14px; }
  #busy { height: 3px; background: linear-gradient(90deg, #BE1E2D 30%, transparent 30%); background-size: 200% 100%; animation: b 1s linear infinite; }
  @keyframes b { from { background-position: 100% 0; } to { background-position: -100% 0; } }
</style>
</head>

<script>
// <cellStyle> kopia logic/grafikFb.js (cellStyle, headerStyle) – kolory jak w karcie G; zgodność pilnuje test/grafik-kod.test.js
const lc = (s) => String(s ?? '').trim().toLowerCase();
const has = (code, part) => lc(code).includes(lc(part));
const eq = (code, v) => lc(code) === lc(v);
const S = (bg, color, bold = false, italic = false) => ({ bg, color, bold, italic });
const DEFAULT_STYLE = S('#ffffff', '#000000');
function cellStyle(code, iso, ctx = {}) {
  const c = String(code ?? '').trim(), l = c.toLowerCase(), empty = c === '';
  const today = ctx.todayIso || '', h = ctx.hour ?? 12;
  const dow = iso ? new Date(iso + 'T00:00:00Z').getUTCDay() : -1;
  const first = l.charAt(0), third = l.charAt(2);
  const yesterday = today ? new Date(Date.parse(today + 'T00:00:00Z') - 86400000).toISOString().slice(0, 10) : '';
  if (c.includes('*')) return S('#1155cc', '#ffffff', true);
  if (eq(c, 'L4')) return S('#000000', '#ffff00');
  if (eq(c, 'UT') && ctx.utNegative) return S('#ff0000', '#000000', true, true);
  if (eq(c, 'UT')) return S('#92d050', '#38761d', true, true);
  if (eq(c, 'KW')) return S('#ff0000', '#ffff00', true, true);
  if (eq(c, 'BHP')) return S('#ffff00', '#000000', true);
  if (eq(c, 'BO') || eq(c, 'BK')) return S('#00ffff', '#000000', true);
  if (eq(c, 'Op')) return S('#ff9900', '#000000', true, true);
  if (eq(c, 'Hdk')) return S('#ffffff', '#980000', true, true);
  if (eq(c, 'Nż')) return S('#0d904f', '#ff0000', true, true);
  if (eq(c, 'Ojc')) return S('#ff00ff', '#000000', true, true);
  if (eq(c, 'OKL')) return S('#9900ff', '#ffffff', true, true);
  if (has(c, '.w')) return S('#0000ff', '#ffff00', true, true);
  if (eq(c, 'V')) return S('#b7e1cd', '#000000');
  if (l.includes('sz')) return S('#7f6000', '#000000', true, true);
  if ((iso && today && iso < today && !empty) || (h >= 14 && first === 'a' && iso === today)) return S('#434343', '#ffffff');
  if (empty && dow === 6) return S('#00b0f0', '#ffffff');
  if (empty && (dow === 0 || ctx.holiday)) return S('#cc0000', '#ffffff');
  if (has(c, 'Egz')) return S('#00ff00', '#000000', true, true);
  if (has(c, 'AUDIT')) return S('#980000', '#00ff00', true, true);
  if (iso && today && ((h <= 14 && (first === 'a' || third === 'a') && iso === today) || (h > 14 && h <= 22 && first === 'b' && iso === today)
    || (h <= 6 && first === 'c' && iso === yesterday) || (h >= 22 && first === 'c' && iso === today))) return S('#00b050', '#000000', true, true);
  if (c.includes('?') && /[abc]/.test(l)) return S('#ff0000', '#ff0000');
  const shiftLetter = c.length === 4 ? third : first;
  if (shiftLetter === 'a') return S('#f3f3f3', '#000000');
  if (shiftLetter === 'b') return S('#d9d9d9', '#000000');
  if (shiftLetter === 'c') return S('#b7b7b7', '#000000');
  if (empty) return S('#000000', '#000000');
  if (c === '?') return S('#ffc7ff', '#000000', true, true);
  if (c === '!!') return S('#00ffff', '#ff0000', true, true);
  return DEFAULT_STYLE;
}
function headerStyle(iso, holiday) {
  const dow = new Date(iso + 'T00:00:00Z').getUTCDay();
  if (dow === 6) return S('#00b0f0', '#ffffff');
  if (dow === 0 || holiday) return S('#cc0000', '#ffffff');
  return S('#ffffff', '#000000');
}
// </cellStyle>

const $ = (id) => document.getElementById(id);
const store = { get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) { /* bez pamięci */ } } };
const pad = (n) => String(n).padStart(2, '0');
const localIso = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const addDays = (iso, n) => { const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const DOW = ['nd', 'pn', 'wt', 'śr', 'cz', 'pt', 'so'];
const LEN = 14;
let code = store.get('grk.code') || '', from = addDays(localIso(new Date()), -2), data = null;

function call(fn, ...args) {
  return new Promise((ok, bad) => google.script.run.withSuccessHandler(ok).withFailureHandler((e) => bad(e && e.message ? e : new Error(String(e))))[fn](...args));
}
function msg(t) { const m = $('msg'); m.textContent = t; m.classList.remove('hidden'); clearTimeout(msg.t); msg.t = setTimeout(() => m.classList.add('hidden'), 4000); }

async function load() {
  $('busy').classList.remove('hidden');
  try {
    data = await call('grk_view', code, from, addDays(from, LEN - 1));
    store.set('grk.code', code);
    $('login').classList.add('hidden'); $('app').classList.remove('hidden');
    render();
    return true;
  } catch (e) {
    if (/kod/i.test(e.message)) { store.set('grk.code', null); showLogin(e.message); } else if (data) msg(e.message); else showLogin(e.message);
    return false;
  } finally { $('busy').classList.add('hidden'); }
}
function showLogin(err) { $('app').classList.add('hidden'); $('login').classList.remove('hidden'); $('err').textContent = err || ''; }

function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]); }
function render() {
  const d = data, today = localIso(new Date()), hour = new Date().getHours(), hol = new Set(d.holidays || []);
  const f = (x) => x.slice(8, 10) + '.' + x.slice(5, 7);
  $('who').textContent = d.who;
  $('range').textContent = f(d.from) + '–' + f(d.to);
  const q = lc($('q').value);
  let h = '<thead><tr><th class="nm">Pracownik</th>';
  for (const iso of d.days) {
    const s = headerStyle(iso, hol.has(iso));
    h += `<th class="${iso === today ? 'today' : ''}" style="background:${s.bg};color:${s.color}">${f(iso)}<br>${DOW[new Date(iso + 'T00:00:00Z').getUTCDay()]}</th>`;
  }
  h += '</tr></thead><tbody>';
  let pendingSep = null;
  for (const p of d.people) {
    if (p.sep) { pendingSep = p; continue; }
    if (q && !lc(p.name).includes(q)) continue;
    if (pendingSep) { h += `<tr class="sep"><td class="nm">${esc(pendingSep.name)}</td><td colspan="${d.days.length}"></td></tr>`; pendingSep = null; }
    h += `<tr class="${p.id === d.pid ? 'me' : ''}" ${p.id === d.pid ? 'id="me"' : ''}><td class="nm">${esc(p.name)}${p.place ? ' <span class="pl">' + esc(p.place) + '</span>' : ''}</td>`;
    for (const iso of d.days) {
      const c = ((d.codes[p.id] || {})[iso]) || '', n = ((d.notes[p.id] || {})[iso]) || '';
      const s = cellStyle(c, iso, { todayIso: today, hour, holiday: hol.has(iso) });
      h += `<td class="c${n ? ' note' : ''}" data-n="${esc(n)}" style="background:${s.bg};color:${s.color};${s.bold ? 'font-weight:bold;' : ''}${s.italic ? 'font-style:italic;' : ''}">${esc(c)}</td>`;
    }
    h += '</tr>';
  }
  $('t').innerHTML = h + '</tbody>';
}

$('go').onclick = () => { code = $('code').value.replace(/\D/g, ''); if (code.length < 8) { $('err').textContent = 'Kod ma 8 cyfr.'; return; } $('err').textContent = ''; load(); };
$('code').onkeydown = (e) => { if (e.key === 'Enter') $('go').click(); };
$('out').onclick = () => { store.set('grk.code', null); code = ''; data = null; $('code').value = ''; showLogin(''); };
$('prev').onclick = () => { from = addDays(from, -7); load(); };
$('next').onclick = () => { from = addDays(from, 7); load(); };
$('now').onclick = () => { from = addDays(localIso(new Date()), -2); load(); };
$('ref').onclick = () => load();
$('q').oninput = () => data && render();
$('t').onclick = (e) => { const td = e.target.closest('td.c'); if (td && td.dataset.n) msg('Komentarz: ' + td.dataset.n); };
if (code) load(); else showLogin('');
</script>
</body>
</html>
