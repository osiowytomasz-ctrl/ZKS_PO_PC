name: Build Windows (portable)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build portable exe and zip
        run: npx electron-builder --win portable zip --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: ZKS-PO-windows
          path: |
            dist/*.exe
            dist/*.zip
      - name: Publish release "latest"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/*.exe dist/*.zip --title "ZKS PO – najnowsza wersja (Windows)" --notes "Wersja przenośna: pobierz plik .exe i uruchom (bez instalacji, bez Node.js)."

      # Wydanie „ZKS PO Narzędziownia” – ten sam kod, same moduły narzędziowni (package.json → zksEdition: narz)
      - name: Build Narzędziownia (portable exe and zip)
        shell: bash
        run: npx electron-builder --win portable zip --x64 --publish never -c.extraMetadata.zksEdition=narz -c.productName="ZKS PO Narzedziownia" -c.appId=pl.zks.po.narz -c.directories.output=dist-narz -c.portable.artifactName=ZKS-PO-Narzedziownia-portable.exe '-c.artifactName=ZKS-PO-Narzedziownia-${version}-${os}-${arch}.${ext}'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: ZKS-PO-Narzedziownia-windows
          path: |
            dist-narz/*.exe
            dist-narz/*.zip
      - name: Publish release "narzedziownia"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete narzedziownia --yes --cleanup-tag || true
          gh release create narzedziownia dist-narz/*.exe dist-narz/*.zip --title "ZKS PO Narzędziownia – najnowsza wersja (Windows)" --notes "Sama Narzędziownia (ToolBuilder, Assem.Tool, ToolTrack, Kontury, Części) – lżejsza wersja przenośna. Ustawienia połączenia przejmuje z pełnego programu przy pierwszym uruchomieniu."
