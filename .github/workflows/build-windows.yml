name: Build Windows (portable)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# tylko najnowszy push buduje i publikuje wydanie „latest” – starsze, wolniejsze uruchomienie nie nadpisze nowszego (wcześniej wydanie mogło dostać plik z poprzedniej wersji)
concurrency:
  group: build-windows-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build portable exe
        run: npx electron-builder --win portable --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: ZKS-PO-windows
          path: dist/*.exe
      - name: Publish release "latest"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # publikujemy tylko plik portable (nazwa bez zmian: ZKS-PO-portable.exe); numer wersji jest w tytule wydania
          VERSION=$(node -p "require('./package.json').version")
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/*.exe --title "ZKS PO ${VERSION} – najnowsza wersja (Windows)" --notes "Wersja ${VERSION}. Wersja przenośna: pobierz plik .exe i uruchom (bez instalacji, bez Node.js)."

      - name: Remove old release "narzedziownia"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete narzedziownia --yes --cleanup-tag || true
