name: Build Windows (portable)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build portable exe and zip
        run: npx electron-builder --win portable zip --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: ZKS-PO-windows
          path: |
            dist/*.exe
            dist/*.zip
      - name: Publish release "latest"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/*.exe dist/*.zip --title "ZKS PO – najnowsza wersja (Windows)" --notes "Wersja przenośna: pobierz plik .exe i uruchom (bez instalacji, bez Node.js)."
