name: Wersja na iPhone'a (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'iphone/**'
      - 'src/renderer/**'
      - 'scripts/build-iphone.mjs'
      - '.github/workflows/iphone-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# tylko najnowsza publikacja
concurrency:
  group: iphone-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Zbuduj stronę
        run: node scripts/build-iphone.mjs _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # wdrożenie w osobnym zadaniu + krótka pauza: GitHub potrzebuje chwili, by zarejestrować świeżo przesłany artefakt
  # (bez tego deploy-pages bywa kończył się błędem „Fetching artifact metadata failed / No artifacts named github-pages”)
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Poczekaj na rejestrację artefaktu
        run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v4
